name: Auto Renew PidginHost VPS

on:
  # 提交/推送代码到 main 分支时自动触发（用于测试）
  push:
    branches: [main]
  # 每 10 天运行一次（UTC 00:00 = 北京时间 08:00）
  # 注意：GitHub 的 schedule cron 用 UTC 时间；*/10 表示每月的 1/11/21/31 号
  schedule:
    - cron: '0 0 */10 * *'
  # 支持在 GitHub Actions 页面手动触发
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Check required secrets
        env:
          PIDGIN_EMAIL: ${{ secrets.PIDGIN_EMAIL }}
          PIDGIN_PASSWORD: ${{ secrets.PIDGIN_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SMTP_CONFIG: ${{ secrets.SMTP_CONFIG }}
        run: |
          if [ -z "$PIDGIN_EMAIL" ] || [ -z "$PIDGIN_PASSWORD" ]; then
            echo "::error::缺少必需 Secrets: PIDGIN_EMAIL / PIDGIN_PASSWORD"
            echo "请到仓库 Settings → Secrets and variables → Actions 配置后再运行"
            echo "（TG_BOT_TOKEN / TG_CHAT_ID 可选，不配则跳过 TG 通知）"
            exit 1
          fi
          echo "✅ Secrets 已配置"
          [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ] && echo "✅ TG 通知已配置" || echo "⚠️ TG 通知未配置（将跳过）"
          [ -n "$SMTP_CONFIG" ] && echo "✅ SMTP 通知已配置" || echo "⚠️ SMTP 通知未配置（将跳过）"

      - name: Run PidginHost auto-renew
        env:
          PIDGIN_EMAIL: ${{ secrets.PIDGIN_EMAIL }}
          PIDGIN_PASSWORD: ${{ secrets.PIDGIN_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SMTP_CONFIG: ${{ secrets.SMTP_CONFIG }}
        run: |
          python renew_pidginhost.py --debug

      - name: Upload error screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_screenshot.png
          if-no-files-found: ignore

      # 清理旧 run jobs：只保留最新 1 条运行记录
      - name: clear old run jobs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "deleted: $run_id"
              gh run delete $run_id || true
            fi
          done

      # 每次运行把时间写入 time.txt 并推送（[skip ci] 防止触发新 workflow 造成死循环）
      - name: Commit time.txt to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          date '+%Y-%m-%d %H:%M:%S' > time.txt

          git add time.txt
          git commit -m "Update time.txt [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}
